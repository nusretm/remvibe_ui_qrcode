name: UC-1 iOS Simulator Build Smoke

# GitHub-hosted macOS build only: no iOS provisioning or IPA publication.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/uc1-ios-simulator.yml"

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"

      - name: Record toolchain versions
        shell: bash
        run: |
          echo "Source commit: $GITHUB_SHA"
          xcodebuild -version
          flutter --version
          flutter doctor -v

      - name: Fetch Example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example for iOS Simulator (unsigned)
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign

      - name: Archive simulator .app bundle
        shell: bash
        run: |
          test -d example/build/ios/iphonesimulator/Runner.app
          ditto -c -k --keepParent \
            example/build/ios/iphonesimulator/Runner.app \
            ios-simulator-Runner.zip

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: remvibe-ui-qrcode-ios-simulator
          path: ios-simulator-Runner.zip
          if-no-files-found: error
          retention-days: 7
